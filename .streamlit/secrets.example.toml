# Copy this file to `.streamlit/secrets.toml` and change the values.
# Do not commit `.streamlit/secrets.toml` or `.streamlit/users.json`.

# `registration_code` is required to create new users after the first user exists.
# Leave it commented to disable self-service new user creation.
[auth]
# registration_code = "change-this-registration-code"

# Optional: seed fixed users from secrets.
# Passwords changed in the app are saved to `.streamlit/users.json`.
[auth.users]
# admin = "change-this-password"
